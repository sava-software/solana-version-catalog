# Paths are relative to --workspace (default: parent of this repository).
# Public consumers only. Machine-local consumers belong in a separate --registry file.
# Validation arguments are whitespace-separated, passed directly to Gradle without a shell.
# Worktrees/forks/certification duplicates and retired anchor-programs are excluded.
# builds lists the standalone builds that apply the BOM; a build that does not is validated, not probed.
# branch is the branch a prepared update belongs on; a checkout on another branch is blocked.
# coldResolve follows each consumer's own rule that a new BOM is validated again from an empty
# GRADLE_USER_HOME: stated in its AGENTS.md or verification guide, or adopted from sava-build's
# README ("Verifying sava artifacts", step 4) where the notes say so.
version=1
consumers=sava,ravina,idl-clients,ix-mapper-java,glam-sdk-java,incident-client,http-servers,json-iterator

consumer.sava.path=sava
consumer.sava.pin=gradle/sava.properties
consumer.sava.branch=main
consumer.sava.builds=.,jmh,soak
consumer.sava.coldResolve=true
consumer.sava.notes=The root automatically includes gradle/plugins; independent jmh and soak builds share the verification policy. New BOMs also require cold-cache resolution of all three builds per gradle/verification/README.md.
consumer.sava.validation.0=./gradlew --no-daemon --no-configuration-cache check resolveVerificationTools
consumer.sava.validation.1=./gradlew --no-daemon --no-configuration-cache -p jmh jmhJar
consumer.sava.validation.2=./gradlew --no-daemon --no-configuration-cache -p soak classes jar soakModulePath

consumer.ravina.path=ravina
consumer.ravina.pin=gradle/sava.properties
consumer.ravina.branch=main
consumer.ravina.builds=.,soak
consumer.ravina.coldResolve=true
consumer.ravina.notes=AGENTS.md adopts sava-build's verification procedure, whose step 4 validates a new BOM from an empty GRADLE_USER_HOME, running every build of the repository.
consumer.ravina.validation.0=./gradlew --no-daemon --no-configuration-cache check resolveVerificationTools
consumer.ravina.validation.1=./gradlew --no-daemon --no-configuration-cache -p soak testClasses soakModulePath

consumer.idl-clients.path=idl-clients
consumer.idl-clients.pin=gradle/sava.properties
consumer.idl-clients.branch=main
consumer.idl-clients.builds=.
consumer.idl-clients.coldResolve=true
consumer.idl-clients.notes=AGENTS.md requires a new BOM to be validated once more from an empty GRADLE_USER_HOME.
consumer.idl-clients.validation.0=./gradlew --no-daemon --no-configuration-cache check resolveVerificationTools

consumer.ix-mapper-java.path=ix-mapper-java
consumer.ix-mapper-java.pin=gradle/sava.properties
consumer.ix-mapper-java.branch=main
consumer.ix-mapper-java.builds=.
consumer.ix-mapper-java.coldResolve=true
consumer.ix-mapper-java.notes=AGENTS.md additionally requires resolution of a new BOM from an empty GRADLE_USER_HOME with only Java toolchain settings and package credentials supplied through environment variables.
consumer.ix-mapper-java.validation.0=./gradlew --no-daemon --no-configuration-cache check resolveVerificationTools

consumer.glam-sdk-java.path=glam-sdk-java
consumer.glam-sdk-java.pin=gradle/sava.properties
consumer.glam-sdk-java.branch=main
consumer.glam-sdk-java.builds=.
consumer.glam-sdk-java.coldResolve=true
consumer.glam-sdk-java.notes=AGENTS.md additionally requires new-BOM resolution from an empty GRADLE_USER_HOME. Keep sibling source composites disabled for published dependency validation.
consumer.glam-sdk-java.validation.0=./gradlew --no-daemon --no-configuration-cache check resolveVerificationTools

consumer.incident-client.path=incident-client
consumer.incident-client.pin=gradle/sava.properties
consumer.incident-client.branch=main
consumer.incident-client.builds=.
consumer.incident-client.coldResolve=true
consumer.incident-client.notes=AGENTS.md additionally requires new-BOM resolution from an empty GRADLE_USER_HOME with only Java toolchain settings and package credentials supplied through environment variables.
consumer.incident-client.validation.0=./gradlew --no-daemon --no-configuration-cache check resolveVerificationTools

consumer.http-servers.path=http-servers
consumer.http-servers.pin=gradle/sava.properties
consumer.http-servers.branch=main
consumer.http-servers.builds=.
consumer.http-servers.coldResolve=true
consumer.http-servers.notes=AGENTS.md adopts sava-build's verification procedure, whose step 4 validates a new BOM from an empty GRADLE_USER_HOME.
consumer.http-servers.validation.0=./gradlew --no-daemon --no-configuration-cache check resolveVerificationTools

consumer.json-iterator.path=json-iterator
consumer.json-iterator.pin=gradle/sava.properties
consumer.json-iterator.branch=main
consumer.json-iterator.builds=.
consumer.json-iterator.coldResolve=true
consumer.json-iterator.notes=The jmh build applies no BOM, so it is validated but not probed: its dependency repositories are Maven Central alone, and only its sava-build plugin comes from GitHub Packages. AGENTS.md adopts sava-build's verification procedure, whose step 4 validates a new BOM from an empty GRADLE_USER_HOME, running every build of the repository.
consumer.json-iterator.validation.0=./gradlew --no-daemon --no-configuration-cache check resolveVerificationTools
consumer.json-iterator.validation.1=./gradlew --no-daemon --no-configuration-cache -p jmh check jmhJar

